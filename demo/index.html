<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>neuron-db · memory console</title>
  <style>
    :root {
      --bg: #070b10; --panel: #0d141c; --line: #1c2733; --ink: #d7e2ec; --dim: #6b7d8f;
      --teal: #34d399; --teal-dim: #1f7a5c; --amber: #f5b454; --pink: #f472b6; --blue: #7c9cff;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #0c1620 0%, var(--bg) 60%);
      color: var(--ink); font-family: var(--mono); font-size: 14px; line-height: 1.5;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    a { color: var(--teal); }
    #app { width: 100%; max-width: 760px; }

    /* ── login ── */
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 28px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .brand b { font-size: 20px; letter-spacing: .2px; }
    .brand .v { color: var(--teal); font-size: 12px; }
    .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 22px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
    input {
      width: 100%; background: #0a1118; border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); font-family: var(--mono); font-size: 14px; padding: 10px 12px; outline: none;
    }
    input:focus { border-color: var(--teal-dim); box-shadow: 0 0 0 3px rgba(52,211,153,.12); }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      flex: 1; cursor: pointer; font-family: var(--mono); font-size: 13.5px; font-weight: 600;
      border-radius: 8px; padding: 10px 14px; border: 1px solid var(--teal-dim);
      background: rgba(52,211,153,.12); color: var(--teal); transition: background .15s;
    }
    button:hover { background: rgba(52,211,153,.2); }
    button.ghost { border-color: var(--line); background: transparent; color: var(--dim); }
    button.ghost:hover { color: var(--ink); border-color: var(--dim); }
    .status { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--amber); }
    .note { color: var(--dim); font-size: 11.5px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }

    /* ── console ── */
    .term { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: #0a1119; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .bar .who { margin-left: auto; color: var(--dim); font-size: 12px; }
    .bar .who b { color: var(--teal); }
    .out { height: 60vh; min-height: 340px; overflow-y: auto; padding: 16px; white-space: pre-wrap; word-break: break-word; }
    .out .l { margin: 0 0 2px; }
    .you { color: var(--ink); } .you::before { content: "› "; color: var(--teal); }
    .sys { color: var(--dim); } .ans { color: var(--ink); }
    .ok { color: var(--teal); } .warn { color: var(--amber); } .err { color: var(--pink); } .meta { color: var(--blue); }
    .prompt { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 12px 16px; }
    .prompt span { color: var(--teal); }
    .prompt input { border: none; background: transparent; padding: 0; }
    .prompt input:focus { box-shadow: none; }
    .stat { font-size: 11px; color: var(--dim); }
    .stat b { color: var(--ink); }
    .scrollbar::-webkit-scrollbar { width: 9px; } .scrollbar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
