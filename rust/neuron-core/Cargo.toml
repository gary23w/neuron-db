[package]
name = "neuron-core"
version = "0.1.0"
edition = "2021"
description = "Associative memory core (the neuron) in pure Rust, std-only. Write facts in language, recall by cue."
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]
name = "neuron_core"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[features]
default = []
sqlite = ["dep:rusqlite"]
secure = ["sqlite", "dep:aes-gcm", "dep:sha2", "dep:hmac", "dep:base64", "dep:getrandom"]
server = ["sqlite"]
mcp = ["sqlite"]
semantic = []

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
aes-gcm  = { version = "0.10", optional = true }
sha2     = { version = "0.10", optional = true }
hmac     = { version = "0.12", optional = true }
base64   = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }

[[bin]]
name = "neuron"
path = "src/cli.rs"
required-features = ["sqlite"]

[[bin]]
name = "serve"
path = "src/serve_bin.rs"
required-features = ["server"]

[[bin]]
name = "neuron-mcp"
path = "src/mcp_bin.rs"
required-features = ["mcp"]

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "think"
path = "src/think.rs"

[[example]]
name = "quickstart"
required-features = ["sqlite"]

[[example]]
name = "chatbot_memory"
required-features = ["sqlite"]

[[example]]
name = "user_profiles"
required-features = ["sqlite"]

[[example]]
name = "encrypted_secrets"
required-features = ["secure"]

[[example]]
name = "db_bench"
required-features = ["sqlite"]

[[example]]
name = "scenario_bench"
required-features = ["sqlite"]

[[example]]
name = "llm_memory_bench"
required-features = ["sqlite"]

[[example]]
name = "book_ingest"
required-features = ["sqlite", "semantic"]

# no-LLM, no-model examples — the default std-only store as a plain app database
[[example]]
name = "plastic_adaptive"

[[example]]
name = "plastic_bench"

[[example]]
name = "sharded_scale"

# one-stop raw metrics across every tier + serialized byte-size/density
[[example]]
name = "metrics"
required-features = ["secure", "semantic"]

# how big can the total addressable context grow at flat per-turn cost
[[example]]
name = "context_scale"
