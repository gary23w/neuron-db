[package]
name = "neuron-core"
version = "0.3.0"
edition = "2021"
description = "Associative memory core (the neuron) in pure Rust, std-only. Write facts in language, recall by cue."
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]
name = "neuron_core"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[features]
default = ["cortex"]
cortex = []                    # bakes the gary-neuron cortex into the wasm (run/gary/selftest); turn OFF for a store-only backend build
sqlite = ["dep:rusqlite"]
secure = ["sqlite", "dep:aes-gcm", "dep:sha2", "dep:hmac", "dep:base64", "dep:getrandom"]
server = ["sqlite"]
mcp = ["sqlite", "semantic", "cortex"]   # semantic-ranked recall + the cortex (the `route` tool); never bypassed
semantic = []
compress = []                  # opt-in: lossless token-Huffman codec over the dump() blob (std-only, wasm-safe)
http = []                      # opt-in: WASM gains a host_http import + fetch/fetched ops (browser host provides fetch)

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
aes-gcm  = { version = "0.10", optional = true }
sha2     = { version = "0.10", optional = true }
hmac     = { version = "0.12", optional = true }
base64   = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }

[[bin]]
name = "neuron"
path = "src/cli.rs"
required-features = ["sqlite", "cortex"]   # the CLI always carries the cortex (neuron route); never store-only

[[bin]]
name = "serve"
path = "src/serve_bin.rs"
required-features = ["server"]

[[bin]]
name = "neuron-mcp"
path = "src/mcp_bin.rs"
required-features = ["mcp"]

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "think"
path = "src/think.rs"
required-features = ["cortex"]

[[example]]
name = "quickstart"
required-features = ["sqlite"]

[[example]]
name = "chatbot_memory"
required-features = ["sqlite"]

[[example]]
name = "user_profiles"
required-features = ["sqlite"]

[[example]]
name = "encrypted_secrets"
required-features = ["secure"]

[[example]]
name = "db_bench"
required-features = ["sqlite"]

# "1000 books" density + retrieval-at-scale sweep (storage density, p50/p99 recall, write cost,
# disk-full mode). The empirical answer to "does the load-factor wall apply to neuron-db?".
[[example]]
name = "density_bench"
required-features = ["sqlite"]

# byte anatomy of a single fact (text vs scalars vs ZERO stored coordinates) + the semantic
# space's DIM cost. The empirical answer to "how many dimensions does a neuron fill?".
[[example]]
name = "dimension_anatomy"
required-features = ["sqlite", "semantic"]

# (a) semantic DIM sweep: recall quality (neighbor coherence + paraphrase top-1) vs size vs
# embed speed at DIM 64/128/256/512/1024 — "how would extended dimensions affect recall?".
[[example]]
name = "dim_sweep"
required-features = ["semantic"]

# (b) HDC/VSA superposition capacity micro-test: how many key->value pairs fit in ONE D-bit
# vector before crosstalk breaks recall (the real, lossy 'pack more into dimensions' idea).
[[example]]
name = "hdc_superposition"

# compression probe: sizes the squeezable text room per node (raw vs interned vs entropy floor)
# + the marginal warm-vocab cost + index-postings (delta+varint) — the lossless density ceiling.
[[example]]
name = "compression_probe"

# (b)+(c) end-to-end: compress the real dump() blob with the lossless token-Huffman codec, prove
# recall survives the round-trip, measure on-disk shrink + throughput. Real prose or synthetic.
[[example]]
name = "compression_bench"
required-features = ["compress"]

[[example]]
name = "scenario_bench"
required-features = ["sqlite"]

[[example]]
name = "llm_memory_bench"
required-features = ["sqlite"]

[[example]]
name = "book_ingest"
required-features = ["sqlite", "semantic"]

# no-LLM, no-model examples — the default std-only store as a plain app database
[[example]]
name = "plastic_adaptive"

[[example]]
name = "plastic_bench"

[[example]]
name = "sharded_scale"

# one-stop raw metrics across every tier + serialized byte-size/density
[[example]]
name = "metrics"
required-features = ["secure", "semantic"]

# how big can the total addressable context grow at flat per-turn cost
[[example]]
name = "context_scale"

# space breakdown of the per-document storage pattern (store / semantic space / embedding cache)
[[example]]
name = "doc_storage_space"
required-features = ["sqlite", "semantic"]

# head-to-head vs dense-vector embeddings (uses the durable db + the semantic space)
[[example]]
name = "vs_vectors"
required-features = ["sqlite", "semantic"]
