[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-db"
version = "0.2.0"
description = "Memory you talk to, in a single SQLite file. Write facts in plain language, query by meaning, no model or embeddings required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gary23w" }]
keywords = ["memory", "database", "associative", "recall", "sqlite", "agents", "llm-memory"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/gary23w/neuron-db"
Source = "https://github.com/gary23w/neuron-db"

[project.scripts]
neuron-db = "neuron_db.__main__:main"

[tool.setuptools]
packages = ["neuron_db"]
